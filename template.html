<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[title]</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Add MathJaX -->
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js">
    </script>
    <!-- Add custom delimiter: $ -->
    <script>
      MathJax = {
            tex: {
                inlineMath: {'[+]': [['$', '$']]},
            },
      };
    </script>
</head>
<body>
  <header>
    <h1>[title]</h1>
  </header>

  <main>
    [content]
  </main>

  <footer>
    <p>Created: [created]</p>
    <p>Updated: [updated]</p>
  </footer>
</body>
</html>
