<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Amazing Website</title>
    <link rel="stylesheet" href="./style.css">

    <!-- MathJaX (Math rendering) -->
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js">
    </script>
    <script>
      MathJax = {
        tex: {
          inlineMath: {'[+]': [['$', '$']]}, /* Add custom in-line delimiter: $ */
        },
      };
    </script>

    <!-- Prism.js (Code syntax highlighting) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/themes/prism.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>
  <header>
    <h1>My Amazing Website!</h1>
  </header>

  <main>
    <p>This is <em>your amazing website</em> to do with as you please</p>

    <p>This is a photograph of a dog</p>
    <img alt='Photograph of a dog' src='./attachments/Photograph%20of%20a%20dog.jpg'>
  </main>

  <footer>
    <p>© 2026 My Amazing Website</p>
  </footer>
</body>
</html>
